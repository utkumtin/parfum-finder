[project]
name = "parfum-finder"
version = "0.2.5"
description = "Multi-site price and stock comparison tool for perfume decants"
readme = "README.md"
authors = [
    { name = "Utku Metin", email = "utkumtin@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.16.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "python-dotenv>=1.1.0",
    "rapidfuzz>=3.14.5",
    "selectolax>=0.4.11",
    "textual>=8.2.8",
]

[project.scripts]
parfum-finder = "parfum_finder:main"

[project.optional-dependencies]
browser = [
    "playwright>=1.62.0",
]
sheets = [
    "gspread>=6.1.0",
]
gui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pywebview>=5.3",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pyinstaller>=6.11.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
# PyInstaller execs this file with Analysis/PYZ/EXE/COLLECT/SPECPATH injected
# as builtins; it isn't importable Python and neither ruff nor mypy below
# can see those names.
extend-exclude = ["packaging/parfum-finder.spec"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # import sorting (no separate isort package needed)
    "B",      # bugbear, catches things like mutable default args, swallowed exceptions
    "UP",     # pyupgrade, suggests modern syntax for the targeted Python version
    "ASYNC",  # asyncio-specific bugs, e.g. a blocking call inside an async function
]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = "^(packaging/parfum-finder\\.spec$|dist/)"

[[tool.mypy.overrides]]
# C-extension-backed libraries that don't ship type stubs. If another dependency
# raises "cannot find implementation or library stub", add it here too.
module = ["curl_cffi.*", "selectolax.*", "gspread.*", "webview.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=parfum_finder --cov-report=term-missing"

[tool.coverage.run]
source = ["src/parfum_finder"]
