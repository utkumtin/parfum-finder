name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra gui

      # Windows Defender's real-time scanner has a long-standing history of
      # flagging freshly-built, unsigned PyInstaller bootloaders as a generic
      # trojan and quarantining them before they ever run. The runner is
      # thrown away after this job, so excluding the checkout from scanning
      # costs nothing and keeps that false positive out of the way.
      - name: Exclude the workspace from Windows Defender
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Build exe
        run: uv run pyinstaller packaging/parfum-finder.spec

      # The runner itself is a clean Windows machine, so this doubles as the
      # "does the frozen bundle actually start" check: a missing hidden
      # import fails here with a traceback instead of shipping a build that
      # opens a blank window for the first real user.
      - name: Smoke test the frozen exe
        run: |
          $exePath = ".\dist\parfum-finder\parfum-finder.exe"
          if (-not (Test-Path $exePath)) {
            throw "$exePath is missing after the PyInstaller build (quarantined by antivirus?)."
          }
          & $exePath --selftest
          if ($LASTEXITCODE -ne 0) {
            throw "parfum-finder.exe --selftest failed with exit code $LASTEXITCODE"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: parfum-finder-windows-installer
          path: packaging/Output/*.exe

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$env:RELEASE_TAG" packaging/Output/*.exe --clobber
