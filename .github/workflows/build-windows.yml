name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    # The default GITHUB_TOKEN is read-only unless a workflow asks for more;
    # "Attach installer to the release" below needs to upload a release
    # asset, which is a write. This overrides the repo's default workflow
    # permission setting regardless of what it's currently set to.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # --extra browser pulls in playwright: decantall's search page needs
        # it, and packaging/parfum-finder.spec no longer excludes it from the
        # build. No `playwright install chromium` step here -- fetch.py
        # launches it via channel="msedge" on Windows, using the Edge build
        # already on the machine instead of downloading a separate browser.
        run: uv sync --locked --extra gui --extra browser

      # Windows Defender's real-time scanner has a long-standing history of
      # flagging freshly-built, unsigned PyInstaller bootloaders as a generic
      # trojan and quarantining them before they ever run. The runner is
      # thrown away after this job, so excluding the checkout from scanning
      # costs nothing and keeps that false positive out of the way.
      # %LOCALAPPDATA%\parfum-finder is also excluded: --selftest below makes
      # ensure_user_data() seed sites/platforms/hooks there, and it doesn't
      # exist yet at this point in the job -- Defender accepts exclusion
      # paths for files that don't exist yet and applies once they appear.
      - name: Exclude the workspace from Windows Defender
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\parfum-finder"

      - name: Build exe
        run: uv run pyinstaller packaging/parfum-finder.spec

      # The runner itself is a clean Windows machine, so this doubles as the
      # "does the frozen bundle actually start" check: a missing hidden
      # import fails here with a traceback instead of shipping a build that
      # opens a blank window for the first real user.
      - name: Smoke test the frozen exe
        run: |
          $exePath = ".\dist\parfum-finder\parfum-finder.exe"
          if (-not (Test-Path $exePath)) {
            throw "$exePath is missing after the PyInstaller build (quarantined by antivirus?)."
          }
          # Bundling playwright depends on its own PyInstaller hook firing
          # (see packaging/parfum-finder.spec) rather than an explicit datas
          # entry here, so nothing else catches it silently going missing --
          # e.g. from lock drift or the exclude being reintroduced -- and
          # decantall's search would start failing at runtime with no signal
          # until a user hits it.
          $driverPath = ".\dist\parfum-finder\_internal\playwright\driver"
          if (-not (Test-Path $driverPath)) {
            throw "$driverPath is missing -- playwright didn't get bundled, decantall search will fail at runtime."
          }
          # console=False in the spec makes this a GUI-subsystem exe: it has
          # no console attached at all, so an unhandled Python traceback
          # normally has nowhere to go and vanishes silently. Redirecting
          # stdout/stderr gives Python real handles to write to and gets the
          # actual failure into this log instead of just a bare exit code.
          # Start-Process -Wait -PassThru is also more reliable than reading
          # $LASTEXITCODE directly for a GUI-subsystem process.
          $stdout = Join-Path $env:RUNNER_TEMP "selftest-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "selftest-stderr.txt"
          $proc = Start-Process -FilePath $exePath -ArgumentList "--selftest" -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Write-Host "---- stdout ----"
          Get-Content $stdout -ErrorAction SilentlyContinue
          Write-Host "---- stderr ----"
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            throw "parfum-finder.exe --selftest failed with exit code $($proc.ExitCode)"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: parfum-finder-windows-installer
          path: packaging/Output/*.exe

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$env:RELEASE_TAG" packaging/Output/*.exe --clobber
