name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails the build if uv.lock is out of sync with pyproject.toml,
      # instead of silently resolving a different dependency set than what
      # was committed.
      # The browser extra is installed so mypy type-checks the playwright code
      # paths instead of treating them as Any. The chromium binary itself is not
      # needed for type checking.
      - name: Install dependencies
        run: uv sync --locked --extra browser

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src
